name: Build mediary-scout image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout upstream source
        uses: actions/checkout@v4
        with:
          repository: fancydirty/mediary-scout
          ref: v2026.11.16
          path: src

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./src
          file: ./src/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/ggboy1001/mediary-scout-build:latest
            ghcr.io/ggboy1001/mediary-scout-build:v2026.11.16
          build-args: |
            GIT_SHA=v2026.11.16
          cache-from: type=gha
          cache-to: type=gha,mode=max
